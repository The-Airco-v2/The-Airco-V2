# Savant module definition for Airco Secure 2.0 GPU Pipeline
# Ref: https://docs.savant-ai.io/

name: airco-pipeline

parameters:
  frame:
    width: 1920
    height: 1080
  output_frame:
    codec: raw-rgba

pipeline:
  source:
    element: zeromq_source_bin
    properties:
      socket: ${oc.env:ZMQ_SRC_ENDPOINT}

  elements:
    # Primary person detector via Savant-owned ONNX artifact
    - element: nvinfer@detector
      name: person_detector
      model:
        local_path: /models/yolo26/1
        model_file: yolo26s.onnx
        batch_size: 1
        precision: fp16
        input:
          shape: [3, 640, 640]
          color_format: rgb
          scale_factor: 0.00392156862745098
        output:
          layer_names: [output0]
          num_detected_classes: 80
          converter:
            module: savant.converter.yolo
            class_name: TensorToBBoxConverter
            kwargs:
              confidence_threshold: 0.25
              nms_iou_threshold: 0.45
              top_k: 300
              class_ids: [0]
          objects:
            - class_id: 0
              label: person
              selector:
                module: savant.selector.detector
                class_name: BBoxSelector
                kwargs:
                  confidence_threshold: 0.25
                  nms_iou_threshold: 0.45

    # Tracker
    - element: nvtracker
      properties:
        tracker-width: 640
        tracker-height: 384
        ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
        ll-config-file: /opt/savant/module/config/tracker.yml

    # Secondary phone detector on person crops
    - element: nvinfer@detector
      name: phone_detector
      model:
        local_path: /models/phone_detection/1
        model_file: best.onnx
        batch_size: 1
        precision: fp16
        input:
          object: person_detector.person
          shape: [3, 640, 640]
          color_format: rgb
          scale_factor: 0.00392156862745098
        output:
          layer_names: [output0]
          num_detected_classes: 1
          converter:
            module: savant.converter.yolo
            class_name: TensorToBBoxConverter
            kwargs:
              confidence_threshold: 0.20
              nms_iou_threshold: 0.45
              top_k: 100
              class_ids: [0]
          objects:
            - class_id: 0
              label: phone

    # Custom Python post-processing
    - element: pyfunc
      module: custom_pyfunc
      class_name: CropExtractor
      kwargs:
        face_min_size: 20
        body_min_size: 80
        snapshot_interval_frames: 30
        triton_url: ${oc.env:TRITON_URL,triton:8001}
        use_scrfd: ${oc.env:USE_SCRFD,true}

    - element: pyfunc
      module: redis_sink
      class_name: RedisStreamSink
      kwargs:
        redis_url: ${oc.env:REDIS_URL,redis://redis:6379/0}

  sink:
    - element: devnull_sink

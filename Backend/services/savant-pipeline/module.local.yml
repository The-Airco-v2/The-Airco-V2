# Local development Savant module.
# Keeps the footage pipeline usable on smaller GPUs by running
# only the person detector and post-processing stages.

name: airco-pipeline-local

parameters:
  frame:
    width: 1920
    height: 1080
  output_frame:
    codec: raw-rgba

pipeline:
  source:
    element: uridecodebin
    properties:
      uri: ${oc.env:RTSP_URI,rtsp://host.docker.internal:8556/active_session}

  elements:
    - element: nvinfer@detector
      name: person_detector
      model:
        local_path: /models/yolo26/1
        model_file: yolo26s.onnx
        batch_size: 1
        precision: fp16
        input:
          shape: [3, 640, 640]
          color_format: rgb
          scale_factor: 0.00392156862745098
        output:
          layer_names: [output0]
          num_detected_classes: 80
          converter:
            module: savant.converter.yolo
            class_name: TensorToBBoxConverter
            kwargs:
              confidence_threshold: 0.10
              nms_iou_threshold: 0.45
              top_k: 100
              class_ids: [0]
          objects:
            - class_id: 0
              label: person
              selector:
                module: savant.selector.detector
                class_name: BBoxSelector
                kwargs:
                  confidence_threshold: 0.10
                  nms_iou_threshold: 0.45

    - element: nvtracker
      properties:
        tracker-width: 640
        tracker-height: 384
        ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
        ll-config-file: /opt/savant/module/config/tracker.yml

    - element: pyfunc
      module: airco_custom_pyfunc
      class_name: CropExtractor
      kwargs:
        face_min_size: 40
        body_min_size: 80
        snapshot_interval_frames: 30

    - element: pyfunc
      module: redis_sink
      class_name: RedisStreamSink
      kwargs:
        redis_url: ${oc.env:REDIS_URL,redis://redis:6379/0}

  sink:
    - element: devnull_sink

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Upstream definitions
    upstream api {
        server api:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    upstream centrifugo {
        server centrifugo:8080;
    }

    upstream go2rtc {
        server go2rtc:1984;
    }

    upstream minio_backend {
        server minio:9000;
    }

    upstream portainer_backend {
        server portainer:9000;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name the-airco.net;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main HTTPS server
    server {
        listen 443 ssl;
        server_name the-airco.net;

        ssl_certificate /etc/letsencrypt/live/the-airco.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/the-airco.net/privkey.pem;

        # API
        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check shortcut
        location /health {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Centrifugo WebSocket — strip /ws/ prefix so Centrifugo sees /connection/websocket
        location /ws/ {
            proxy_pass http://centrifugo/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Go2RTC WebRTC
        location /webrtc/ {
            proxy_pass http://go2rtc/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # MinIO evidence images
        location /evidence/ {
            proxy_pass http://minio_backend/airco-evidence/;
            proxy_set_header Host $host;
        }

        # Portainer UI — served at root path via internal proxy
        # Portainer CE does not support subpath, so we proxy at /portainer/
        # and use its --base-url flag (available in newer CE versions)
        # For now, direct access via the nginx proxy with header rewriting
        location /portainer/ {
            proxy_pass http://portainer_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Rewrite redirects from Portainer to include /portainer/ prefix
            proxy_redirect / /portainer/;
            # Rewrite asset paths in HTML responses
            sub_filter 'href="/' 'href="/portainer/';
            sub_filter 'src="/' 'src="/portainer/';
            sub_filter_once off;
            sub_filter_types text/html application/javascript;
        }

        # Frontend (catch-all — must be last)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

[alembic]
script_location = .
prepend_sys_path = ..
sqlalchemy.url = postgresql://airco:changeme@localhost:5432/airco

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

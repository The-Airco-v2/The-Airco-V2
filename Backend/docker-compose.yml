x-shared-env: &shared-env
  POSTGRES_HOST: timescaledb
  POSTGRES_PORT: "5432"
  POSTGRES_DB: airco
  POSTGRES_USER: airco
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_URL: ${PUBLIC_MINIO_URL:-http://localhost:9000}
  MINIO_PUBLIC_PRESIGN: ${MINIO_PUBLIC_PRESIGN:-true}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-airco}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-changeme}
  MINIO_BUCKET: airco-evidence
  CENTRIFUGO_API_URL: http://centrifugo:8080/api
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-changeme-min-32-chars-in-production!}
  CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:-changeme-min-32-chars-in-production!}
  TRITON_URL: triton:8001
  TENANT_ID: ${TENANT_ID:-default}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-airco_session}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}

services:
  # ── Infrastructure ─────────────────────────────────

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: airco
      POSTGRES_USER: airco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/home/postgres/pgdata/data
      - ./config/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airco"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-airco}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-airco}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-changeme}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      mc mb --ignore-existing local/airco-evidence &&
      mc anonymous set download local/airco-evidence &&
      echo 'MinIO bucket ready'
      "
    restart: "no"

  centrifugo:
    image: centrifugo/centrifugo:v5
    ports:
      - "8080:8080"
    volumes:
      - ./config/centrifugo.json:/centrifugo/config.json
    command: centrifugo -c config.json
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-changeme-min-32-chars-in-production!}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:-changeme-min-32-chars-in-production!}

  go2rtc:
    image: alexxit/go2rtc:latest
    ports:
      - "1984:1984"
      - "8555:8555/tcp"
    volumes:
      - ./config/go2rtc.yml:/config/go2rtc.yaml

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"
      - "8888:8888"
    environment:
      MTX_PROTOCOLS: tcp

  portainer:
    image: portainer/portainer-ce:latest
    expose:
      - "9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

  # ── GPU Services ───────────────────────────────────

  triton:
    profiles: [gpu]
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    ports:
      - "8001:8001"
      - "8002:8002"
    volumes:
      - ./services/triton/models:/models
    command: tritonserver --model-repository=/models --model-control-mode=explicit --load-model=arcface --load-model=osnet --load-model=scrfd --strict-model-config=false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  savant-pipeline:
    profiles: [gpu]
    build:
      context: ./services/savant-pipeline
      dockerfile: Dockerfile
    environment:
      <<: *shared-env
      ZMQ_SRC_ENDPOINT: ""
      ZMQ_SINK_ENDPOINT: ""
    volumes:
      - ./services/savant-pipeline:/opt/savant/module
      - ./services/savant-pipeline/models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - triton
      - redis
      - mediamtx

  # ── Event Consumers ────────────────────────────────

  identity-consumer:
    build:
      context: .
      dockerfile: services/identity-consumer/Dockerfile
    environment:
      <<: *shared-env
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-consumer:
    build:
      context: .
      dockerfile: services/analytics-consumer/Dockerfile
    environment:
      <<: *shared-env
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  snapshot-consumer:
    build:
      context: .
      dockerfile: services/snapshot-consumer/Dockerfile
    environment:
      <<: *shared-env
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  ws-publisher:
    build:
      context: .
      dockerfile: services/ws-publisher/Dockerfile
    environment:
      <<: *shared-env
    depends_on:
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_started

  ultimate-adapter:
    profiles: [gpu]
    build:
      context: .
      dockerfile: services/ultimate-adapter/Dockerfile
    environment:
      <<: *shared-env
      GO2RTC_RTSP_BASE_URL: rtsp://go2rtc:8555
      ULTIMATE_DEVICE: ${ULTIMATE_DEVICE:-cuda:0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy
      go2rtc:
        condition: service_started
      api:
        condition: service_started

  # ── Application Layer ──────────────────────────────

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *shared-env
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_* vars are baked at build time — must be external-facing URLs (reachable from browser)
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8080/connection/websocket}
      NEXT_PUBLIC_GO2RTC_URL: ${PUBLIC_GO2RTC_URL:-http://localhost:1984}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
      - frontend
      - centrifugo
      - go2rtc
      - minio
      - portainer
    restart: unless-stopped

volumes:
  timescaledb_data:
  redis_data:
  minio_data:
  portainer_data:

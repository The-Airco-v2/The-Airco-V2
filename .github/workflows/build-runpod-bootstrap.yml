name: Build RunPod Bootstrap Image

on:
  workflow_dispatch:


jobs:
  build:
    name: Build & push airco-runpod-bootstrap
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: Backend/docker
          file: Backend/docker/Dockerfile.runpod-bootstrap
          push: true
          tags: |
            ghcr.io/the-airco-v2/airco-runpod-bootstrap:latest
            ghcr.io/the-airco-v2/airco-runpod-bootstrap:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Deploy RunPod Pod

on:
  workflow_dispatch:
    inputs:
      rebuild_bootstrap:
        description: Rebuild and push the RunPod bootstrap image before creating the pod
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  deploy-runpod-pod:
    name: Build bootstrap image and deploy RunPod pod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Write RunPod env file
        env:
          RUNPOD_ENV_FILE: ${{ secrets.RUNPOD_ENV_FILE }}
        run: |
          set -euo pipefail
          test -n "${RUNPOD_ENV_FILE}"
          printf '%s\n' "${RUNPOD_ENV_FILE}" > Backend/.env.runpod

      - name: Verify automatic Hostinger cutover is enabled
        run: |
          set -euo pipefail
          grep -q '^AUTO_LINK_HOSTINGER=1$' Backend/.env.runpod

      - name: Log in to GHCR
        if: github.event.inputs.rebuild_bootstrap == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event.inputs.rebuild_bootstrap == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push bootstrap image
        if: github.event.inputs.rebuild_bootstrap == 'true'
        uses: docker/build-push-action@v5
        with:
          context: Backend/docker
          file: Backend/docker/Dockerfile.runpod-bootstrap
          push: true
          tags: |
            ghcr.io/the-airco-v2/airco-runpod-bootstrap:latest
            ghcr.io/the-airco-v2/airco-runpod-bootstrap:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create RunPod pod
        run: |
          set -euo pipefail
          python3 Backend/scripts/create_runpod_pod.py --env-file Backend/.env.runpod
